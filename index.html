<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14301f">

<meta property="og:title" content="Plantolex — The Agricultural Knowledge Encyclopedia">
<meta property="og:description" content="Bilingual agricultural encyclopedia: categories, references, learning, tools and community. موسوعة زراعية ثنائية اللغة.">
<meta property="og:type" content="website">
<title>Plantolex | The Agricultural Knowledge Encyclopedia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
/* Runs before paint: avoids a flash of the wrong theme/direction. */
(function () {
  var d = document.documentElement;
  try {
    var th = localStorage.getItem("plx-theme");
    if (!th) th = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    d.setAttribute("data-theme", th);
    var lg = localStorage.getItem("plx-lang") === "en" ? "en" : "ar";
    d.lang = lg;
    d.dir = lg === "ar" ? "rtl" : "ltr";
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<div id="bar" aria-hidden="true"></div>

<!-- Logo: open book with a sprouting leaf -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="logo" viewBox="40 30 830 560">
    <path style="fill:var(--ink)" d="M150 347 L113 460 C240 462 380 495 447 523 L452 552 C380 502 200 472 58 497 L122 360Z"/>
    <path style="fill:var(--ink)" d="M762 347 L800 460 C672 462 535 495 468 523 L463 552 C535 502 715 472 852 497 L790 360Z"/>
    <path style="fill:var(--ink)" d="M440 538 C446 570 470 570 476 538 L470 522 L446 522Z"/>
    <path style="fill:var(--sage)" d="M188 320 C320 335 410 410 445 516 C360 450 250 425 155 425Z"/>
    <path style="fill:var(--sage)" d="M727 320 C595 335 505 410 470 516 C555 450 665 425 758 422Z"/>
    <path style="fill:var(--sage)" d="M218 130 C300 135 400 180 428 290 C432 330 435 360 440 388 C400 360 350 340 320 320 C250 280 215 210 218 130Z"/>
    <path style="fill:var(--sage)" d="M440 385 C448 430 455 480 456 522 C462 480 468 430 478 380 C465 360 450 370 440 385Z"/>
    <path style="fill:var(--ink)" fill-rule="evenodd" d="M695 45 C700 150 660 250 560 310 C520 330 490 345 475 380 C470 340 460 300 460 240 C470 120 560 70 695 45Z M600 153 C540 185 490 250 465 300 C478 245 520 195 600 153Z"/>
  </symbol>
</svg>

<header class="top">
  <div class="wrap nav">
    <a class="brand" href="#home" aria-label="Plantolex">
      <svg viewBox="40 30 830 560" aria-hidden="true"><use href="#logo"></use></svg>
      <span><b>Plantolex</b><small data-i18n="brandSub"></small></span>
    </a>
    <nav class="main" id="nav">
      <a href="#home" data-i18n="navHome"></a>
      <div class="dd" id="dd">
        <button type="button" id="ddBtn" aria-expanded="false" aria-controls="ddMenu">
          <span data-i18n="navEncyclopedia"></span><span class="caret" aria-hidden="true"></span>
        </button>
        <div class="ddmenu" id="ddMenu"></div>
      </div>
      <a href="#build" data-i18n="navPreview"></a>
    </nav>
    <div class="tools">
      <button class="ib" id="themeBtn" type="button">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="ib" id="langBtn" type="button"></button>
      <button class="ib" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero" id="home">
  <i class="blob b1" aria-hidden="true"></i><i class="blob b2" aria-hidden="true"></i>
  <div class="wrap hgrid">
    <div>
      <span class="eyebrow"><span data-i18n="eyebrow"></span></span>
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>

      <form class="search" id="sform" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <button class="btn" type="submit" data-i18n="searchBtn"></button>
      </form>

      <div class="hero-cta">
        <a class="btn ghost" href="#categories" data-i18n="ctaExplore"></a>
        <a class="text-link" href="#build" data-i18n="ctaSecondary"></a>
      </div>

      <div class="chips">
        <span data-i18n="tryLabel"></span>
        <button class="chip" type="button" data-q="IPM" data-i18n="chipIPM"></button>
        <button class="chip" type="button" data-q="hydroponics" data-i18n="chipHydro"></button>
        <button class="chip" type="button" data-q="soil" data-i18n="chipSoil"></button>
      </div>

      <p class="hero-note" data-i18n="heroNote"></p>
    </div>

    <aside class="hcard" aria-label="Directory">
      <span class="tagline" data-i18n="stStructure"></span>
      <div class="hstats">
        <div class="hstat"><b id="statCats">15</b><span data-i18n="lblCats"></span></div>
        <div class="hstat"><b id="statSubs">156</b><span data-i18n="lblSubs"></span></div>
        <div class="hstat"><b id="statLangs">2</b><span data-i18n="lblLangs"></span></div>
      </div>
      <div class="hlinks" id="heroLinks"></div>
    </aside>
  </div>
</section>

<div class="wrap">
  <section class="results" id="results" aria-live="polite" hidden>
    <div class="rhead">
      <div><h2 data-i18n="rTitle"></h2><div id="rsum"></div></div>
      <button class="rlink" id="clear" type="button" data-i18n="rClear"></button>
    </div>
    <div class="rfilters" id="rfilters" role="group">
      <button class="rf" type="button" data-f="all" aria-pressed="true" data-i18n="rAll"></button>
      <button class="rf" type="button" data-f="cat" aria-pressed="false" data-i18n="rCat"></button>
      <button class="rf" type="button" data-f="sub" aria-pressed="false" data-i18n="rSub"></button>
    </div>
    <div class="rlist" id="rlist"></div>
  </section>
</div>

<main id="main">
  <section class="s" id="categories">
    <div class="wrap">
      <div class="head rv">
        <span class="tag" data-i18n="catTag"></span>
        <h2 data-i18n="catTitle"></h2>
        <p data-i18n="catS"></p>
        <div class="note" data-i18n="catNote"></div>
      </div>
      <div class="catgrid rv" id="catGrid"></div>
      <noscript>
        <p class="note">يحتاج هذا القسم إلى JavaScript لعرض دليل الأقسام. / This section needs JavaScript to display the category directory.</p>
      </noscript>
    </div>
  </section>

  <section class="s alt" id="how">
    <div class="wrap">
      <div class="head rv">
        <span class="tag" data-i18n="howTag"></span>
        <h2 data-i18n="howT"></h2>
        <p data-i18n="howS"></p>
      </div>
      <div class="steps rv">
        <div class="step">
          <div class="n">01</div>
          <h3 data-i18n="howN1T"></h3>
          <p data-i18n="howN1B"></p>
          <span class="badge now" data-i18n="badgeNow"></span>
        </div>
        <div class="step">
          <div class="n">02</div>
          <h3 data-i18n="howN2T"></h3>
          <p data-i18n="howN2B"></p>
          <span class="badge build" data-i18n="badgeBuild"></span>
        </div>
        <div class="step">
          <div class="n">03</div>
          <h3 data-i18n="howN3T"></h3>
          <p data-i18n="howN3B"></p>
          <span class="badge build" data-i18n="badgeBuild"></span>
        </div>
      </div>
      <div class="callout rv">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        <span data-i18n="howNote"></span>
      </div>
    </div>
  </section>

  <section class="s" id="trust">
    <div class="wrap">
      <div class="head rv">
        <span class="tag" data-i18n="trustTag"></span>
        <h2 data-i18n="trustT"></h2>
        <p data-i18n="trustS"></p>
      </div>
      <div class="grid g4 rv">
        <div class="trustcard"><div class="dot" style="--c:var(--c-ref)"></div><h3 data-i18n="t1T"></h3><p data-i18n="t1P"></p></div>
        <div class="trustcard"><div class="dot" style="--c:var(--c-plan)"></div><h3 data-i18n="t2T"></h3><p data-i18n="t2P"></p></div>
        <div class="trustcard"><div class="dot" style="--c:var(--c-spec)"></div><h3 data-i18n="t3T"></h3><p data-i18n="t3P"></p></div>
        <div class="trustcard"><div class="dot" style="--c:var(--sage)"></div><h3 data-i18n="t4T"></h3><p data-i18n="t4P"></p></div>
      </div>
      <div class="never rv">
        <h3 data-i18n="neverT"></h3>
        <ul>
          <li data-i18n="nev1"></li>
          <li data-i18n="nev2"></li>
          <li data-i18n="nev3"></li>
          <li data-i18n="nev4"></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="s alt" id="build">
    <div class="wrap">
      <div class="head rv">
        <span class="tag" data-i18n="buildTag"></span>
        <h2 data-i18n="buildT"></h2>
        <p data-i18n="buildS"></p>
      </div>
      <div class="buildgrid rv">
        <div class="buildcol live">
          <h3><i aria-hidden="true"></i><span data-i18n="liveT"></span></h3>
          <ul>
            <li data-i18n="live1"></li>
            <li data-i18n="live2"></li>
            <li data-i18n="live3"></li>
            <li data-i18n="live4"></li>
          </ul>
        </div>
        <div class="buildcol next">
          <h3><i aria-hidden="true"></i><span data-i18n="nextT"></span></h3>
          <ul>
            <li data-i18n="next1"></li>
            <li data-i18n="next2"></li>
            <li data-i18n="next3"></li>
            <li data-i18n="next4"></li>
            <li data-i18n="next5"></li>
            <li data-i18n="next6"></li>
            <li data-i18n="next7"></li>
          </ul>
        </div>
      </div>
      <p class="note rv" data-i18n="buildNote"></p>
    </div>
  </section>
</main>

<footer class="ft">
  <div class="wrap">
    <div class="fgrid">
      <div>
        <a class="brand" href="#home">
          <svg viewBox="40 30 830 560" aria-hidden="true"><use href="#logo"></use></svg>
          <span><b>Plantolex</b></span>
        </a>
        <p data-i18n="footAbout" style="max-width:380px"></p>
      </div>
      <div>
        <h4 data-i18n="fExplore"></h4>
        <ul>
          <li><a href="#home" data-i18n="fHome"></a></li>
          <li><a href="#categories" data-i18n="fCats"></a></li>
          <li><a href="#home" data-i18n="fSearch"></a></li>
          <li><a href="#build" data-i18n="fBuild"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-i18n="fProject"></h4>
        <ul>
          <li><a href="https://github.com/Kuro-By-Aya/Plantolex" target="_blank" rel="noopener noreferrer" data-i18n="fGitHub"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-i18n="fArriving"></h4>
        <ul class="arriving">
          <li data-i18n="sh1"></li>
          <li data-i18n="sh2"></li>
          <li data-i18n="sh3"></li>
          <li data-i18n="sh4"></li>
          <li data-i18n="sh5"></li>
          <li data-i18n="sh6"></li>
          <li data-i18n="sh7"></li>
        </ul>
      </div>
    </div>
    <div class="fbot">
      <span>© <span id="yr"></span> Plantolex</span>
      <span data-i18n="footTag"></span>
      <a href="#home" data-i18n="top"></a>
    </div>
  </div>
</footer>

<script src="content/ui.js"></script>
<script src="content/categories.js"></script>
<script src="app.js"></script>
</body>
</html>
